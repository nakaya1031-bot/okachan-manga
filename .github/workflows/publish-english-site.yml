name: Publish English site data

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-english-site.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prepared English site
        run: |
          mkdir -p english
          curl -L --fail --retry 2 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-50d8-8206-bd89-d77a19c5c6a6/raw?se=2026-10-05T08%3A20%3A31Z&sp=r&sv=2026-02-06&sr=b&scid=7c9712e6-747b-5783-a77d-5f8ca0b1c79f&skoid=3e273c3d-5ea1-4088-9e18-79685531b184&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-05T03%3A29%3A04Z&ske=2026-10-06T03%3A29%3A04Z&sks=b&skv=2026-02-06&sig=Q16ABdB6Gh1OXoZGFUop%2BO%2BClP1uFac6Jgg4CIHnpVo%3D' -o english/index.html
          test "$(wc -c < english/index.html)" -gt 4000000
      - name: Commit English site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add english/index.html
          git commit -m "Add English manga site" || exit 0
          git push
